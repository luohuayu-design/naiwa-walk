<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9fd8ff">
<title>奶蛙学走路 · 第一关</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#9fd8ff;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ---------- 顶部信息 ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .top{display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(10px + env(safe-area-inset-top)) 14px 0;gap:10px}
  .card{background:rgba(20,28,42,.55);border:1px solid rgba(255,255,255,.18);
    border-radius:14px;padding:8px 12px;color:#fff;font-size:13px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,20,50,.18)}
  .row{display:flex;align-items:center;gap:8px}
  .lbl{opacity:.8;font-weight:600}
  .bar{width:min(38vw,190px);height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
  .bar i{display:block;height:100%;width:60%;border-radius:6px;
    background:linear-gradient(90deg,#ffd93d,#ff9a3d);transition:width .12s linear}
  .num{font-weight:800;font-size:15px;color:#ffd93d}
  .num.flash{color:#3ddc84;text-shadow:0 0 10px #3ddc84}

  .right{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .right .line{display:flex;gap:12px;font-size:13px}
  .right .line b{color:#ffd93d;font-size:15px}

  /* ---------- 底部操作 ---------- */
  #hint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));
    transform:translateX(-50%);color:#fff;font-size:12px;font-weight:700;
    letter-spacing:.06em;text-shadow:0 2px 8px rgba(0,20,50,.45);opacity:.85;z-index:10}

  .pad{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));z-index:12;
    width:clamp(76px,15vmin,112px);height:clamp(76px,15vmin,112px);border-radius:50%;
    border:4px solid #2a3550;background:radial-gradient(circle at 35% 28%,#fff3b0,#ffd93d 62%,#f0b31a);
    color:#2a3550;font-weight:900;font-size:clamp(15px,3.6vmin,22px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 8px 0 #c1900f,0 12px 24px rgba(0,20,50,.32);
    touch-action:none;cursor:pointer;pointer-events:auto;
    transition:transform .06s,box-shadow .06s}
  .pad span{font-size:clamp(19px,4.6vmin,28px);line-height:1}
  .pad:active{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 #c1900f,0 6px 14px rgba(0,20,50,.3)}
  #btnL{left:calc(18px + env(safe-area-inset-left))}
  #btnR{right:calc(18px + env(safe-area-inset-right))}

  /* 竖屏轻提示：能玩，但横屏更好 */
  #rotTip{position:fixed;left:50%;top:calc(78px + env(safe-area-inset-top));
    transform:translateX(-50%);z-index:11;pointer-events:none;display:none;
    background:rgba(20,28,42,.55);color:#ffd93d;font-size:12px;font-weight:700;
    padding:5px 12px;border-radius:999px;white-space:nowrap}
  @media (orientation:portrait){ #rotTip{display:block} }

  /* ---------- 遮罩 ---------- */
  .overlay{position:fixed;inset:0;z-index:20;display:none;
    align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(circle at 50% 30%,rgba(16,26,44,.32),rgba(10,18,32,.72))}
  .overlay.show{display:flex}
  .panel{width:min(560px,92vw);background:linear-gradient(180deg,#fffdf3,#ffeeb8);
    border:4px solid #2a3550;border-radius:26px;padding:22px 22px 18px;text-align:center;
    box-shadow:0 22px 60px rgba(0,15,40,.45);animation:pop .28s ease-out}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .panel h1{font-size:clamp(22px,5.4vmin,32px);color:#2a3550;letter-spacing:.04em}
  .panel .sub{color:#8a6a1a;font-weight:700;font-size:13px;margin:4px 0 14px}
  .panel ul{text-align:left;display:inline-block;color:#3a4761;font-size:14px;
    line-height:1.85;font-weight:600;margin-bottom:16px}
  .panel ul li{list-style:none;padding-left:22px;position:relative}
  .panel ul li::before{content:"🐸";position:absolute;left:0;font-size:13px}
  .btn{pointer-events:auto;border:none;cursor:pointer;
    background:linear-gradient(180deg,#ffe27a,#ffc42e);color:#2a3550;
    font-weight:900;font-size:clamp(16px,3.6vmin,20px);padding:13px 34px;border-radius:999px;
    border-bottom:5px solid #c1900f;box-shadow:0 8px 20px rgba(0,30,60,.22)}
  .btn:active{transform:translateY(3px);border-bottom-width:2px}
  .panel p.desc{color:#3a4761;font-size:14px;font-weight:600;line-height:1.8;margin-bottom:16px}
  .panel p.desc b{color:#2a7bd6}

  .credit{font-size:11px;color:#a08a55;margin-top:10px;font-weight:600}

  #loading{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;
    background:#9fd8ff;color:#2a3550;font-weight:800;font-size:16px;letter-spacing:.1em}
  #loading.show{display:flex}
  #loading:not(.show){display:none}
</style>
</head>
<body>

<div id="app"></div>

<div id="hud">
  <div class="top">
    <div class="card">
      <div class="row" style="margin-bottom:6px">
        <span class="lbl">追赶进度</span>
        <span class="num" id="gapText">4.3 m</span>
      </div>
      <div class="bar"><i id="gapFill"></i></div>
    </div>
    <div class="card right">
      <div class="line"><span class="lbl">下一步</span><b id="nextFoot">任意</b></div>
      <div class="line"><span class="lbl">摔倒</span><b id="falls">0</b>
        <span class="lbl">完美</span><b class="num" id="perfects">0</b></div>
    </div>
  </div>

  <div id="hint">点一下 = 走一步 · 左右交替 · 踩准节拍</div>
  <div class="pad" id="btnL"><span>←</span>左脚</div>
  <div class="pad" id="btnR"><span>→</span>右脚</div>
</div>

<div id="rotTip">横屏体验更佳</div>

<div class="overlay show" id="overlay">
  <div class="panel">
    <h1 id="ovTitle">奶蛙学走路</h1>
    <div class="sub" id="ovDesc">第一关 · 追上那辆公交车</div>
    <ul id="ovList">
      <li>按一下按钮 = 走一步，左右脚必须交替</li>
      <li>地上的节奏圈变<b>绿</b>时点最稳</li>
      <li>点太快会扑倒，点太慢会后仰，点错脚会侧翻</li>
      <li>公交一直往前开，被拉开太远就失败</li>
      <li>电脑也能玩：← 左脚，→ 右脚</li>
    </ul>
    <button class="btn" id="ovBtn">开始学走路</button>
    <div class="credit">公交模型：jeremy / Poly Pizza（CC BY）</div>
  </div>
</div>

<div id="loading" class="show">正在牵奶蛙出场…</div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/jsm/"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
